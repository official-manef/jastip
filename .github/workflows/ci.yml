name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: bunx playwright install --with-deps chromium
      - name: Local accounts and rendered desktop/mobile
        run: |
          mkdir -p screenshots
          npm run dev > /tmp/jastip-dev.log 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8080/api/saya > /dev/null; then break; fi
            sleep 1
          done
          npm run test:trip-api
          node scripts/browser-smoke.mjs http://127.0.0.1:8080 screenshots/jastip-dev.png
          npm run preview:restart
          node scripts/browser-smoke.mjs http://127.0.0.1:8081 screenshots/jastip-built.png --baseline screenshots/jastip-dev.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jastip-render-evidence
          path: screenshots
